name: Préparer et vérifier les sons Halloween
on:
  push:
    branches: [halloween-assets]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer les sons CC0 et leurs preuves de licence
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python scripts/import_halloween.py
      - name: Vérifier le catalogue, le moteur audio et les empreintes
        run: node tests/core.test.js
      - name: Préparer les tests navigateur
        run: python -m pip install playwright
      - name: Vérifier les parcours et le hors-ligne dans Chromium
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: python tests/browser_qa.py
      - name: Sauvegarder les fichiers vérifiés dans la branche de préparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio assets/licenses/sources.json js/sources.js SOUND_SOURCES.md README.md credits.html
          git commit -m 'Importer les neuf sons Halloween CC0 et leurs crédits vérifiés'
          git push origin HEAD:halloween-assets
